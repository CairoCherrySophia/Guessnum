name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Determine basePath
        id: base
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE_PATH=""
          else
            BASE_PATH="/$REPO"
          fi
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"
          echo "Computed base_path='$BASE_PATH'"

      - name: Build
        env:
          PUBLIC_URL: https://${{ github.repository_owner }}.github.io${{ steps.base.outputs.base_path }}
        run: npm run build
        working-directory: frontend

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp index.html 404.html
          touch .nojekyll
        working-directory: frontend/build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


